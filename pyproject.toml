[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "allox-os"
version = "0.1.0"
description = "Allox OS guest services for isolated Agent/Session workspaces"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Allox" }]
keywords = ["agent", "kata", "sandbox", "workspace", "checkpoint"]
dependencies = []

[project.scripts]
allox-workspace-daemon = "allox.workspace.daemon:main"
allox-guest-bootstrap = "allox.runtime.bootstrap:main"

[project.urls]
Repository = "https://github.com/AlloxOrg/allox-os"

# Allox OS 与 allox-cli 是独立发行包。历史控制面代码不进入 OS wheel。
[tool.hatch.build.targets.wheel]
packages = ["src/allox"]
exclude = [
    "src/allox/cli/**",
    "src/allox/vm/**",
    "src/allox/config.py",
    "src/allox/integrations/**",
    "src/allox/runtime/health.py",
    "src/allox/runtime/mcp.py",
    "src/allox/workspace/client.py",
]

# editable 安装时从 src/ 加载，避免改代码后 .venv 仍跑旧 wheel
[tool.hatch.build.targets.editable]
dev-mode-dirs = ["src"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.14.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "src",
    "plugins/process-tree/src",
    "plugins/session-share/src",
    "plugins/session-network/src",
]
