[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "allox-process-tree"
version = "0.1.0"
description = "Optional eBPF Agent/Session process-tree provider for Allox OS"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["allox-os>=0.1.0"]

[project.scripts]
allox-process-tree-bootstrap = "allox_process_tree.bootstrap:main"

[project.entry-points."allox.process_trackers"]
ebpf = "allox_process_tree.backend:EbpfBackend"

[tool.hatch.build.targets.wheel]
packages = ["src/allox_process_tree"]
