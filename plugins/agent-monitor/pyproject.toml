[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "allox-agent-monitor"
version = "0.1.0"
description = "Optional Agent tracing and profiling for Allox OS"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["allox-os>=0.1.0"]

[project.entry-points."allox.workspace_features"]
agent-monitor = "allox_agent_monitor.plugin:AgentMonitorFeature"

[tool.hatch.build.targets.wheel]
packages = ["src/allox_agent_monitor"]
