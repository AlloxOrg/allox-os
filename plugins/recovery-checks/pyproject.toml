[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "allox-recovery-checks"
version = "0.1.0"
description = "Opt-in bounded restore assertions and semantic rollback admission"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["allox-os>=0.1.0"]

[project.entry-points."allox.workspace_features"]
recovery-checks = "allox_recovery_checks.plugin:RecoveryChecksFeature"

[tool.hatch.build.targets.wheel]
packages = ["src/allox_recovery_checks"]
